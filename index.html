<title>Zabava Catalog</title>
<meta name="description" content="Zabava — free browser games catalog, light and dark themes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ============ tokens ============ */
:root{
  /* color — light */
  --bg:#F4FAF6;
  --page-bg:radial-gradient(1100px 640px at 0 0,rgba(180,240,60,.20),rgba(180,240,60,0) 70%),linear-gradient(180deg,#ECF7EF 0,#F4FAF6 560px);
  --surface:#FFFFFF;
  --surface-2:#EAF3EE;
  --control-active:#FFFFFF;
  --border:rgba(16,44,34,.09);
  --border-strong:rgba(16,44,34,.18);
  --text:#0F1E2E;
  --text-2:#52657A;
  --text-3:#8898A8;
  --lime:#B4F03C;
  --lime-hover:#A5E52B;
  --on-lime:#0F1E2E;
  --lime-ink:#3D7A0C;
  --lime-ring:rgba(126,196,32,.30);
  --hot:#FF4A38;
  --top:#3C7BF6;
  --card-bg:#E2ECE6;
  --card-ring:rgba(15,30,46,.07);
  --scrim:rgba(6,14,24,.78);
  --shadow-rest:0 1px 2px rgba(15,30,46,.06);
  --shadow-hover:0 14px 28px -14px rgba(15,30,46,.38);
  --shadow-pop:0 18px 40px -18px rgba(15,30,46,.28),0 2px 6px rgba(15,30,46,.05);
  --tooltip-bg:#0F1E2E;
  --tooltip-fg:#F4FAF6;
  --shadow-rail:14px 0 30px -18px rgba(15,30,46,.3);
  --nav-fg:var(--text);
  --nav-active-bg:var(--lime);
  --nav-active-fg:var(--on-lime);
  --nav-active-ring:none;
  --search-bg:#FBFDFC;
  --search-bg-focus:#FFFFFF;
  --card-ring-hover:rgba(15,30,46,.14);
  --rail-open:184px;
  --content-gap:8px;

  /* type */
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  /* spacing — 4px base */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;
  --gap:10px;
  --rail-w:64px;
  --head-h:72px;
  --gutter:24px;

  /* radius */
  --r-card:10px;
  --r-ctl:10px;
  --r-sm:6px;
  --r-badge:6px;

  /* motion */
  /* one motion language: a single ease, short micro-interactions, slightly longer reveals and theme changes */
  --ease-out:cubic-bezier(.22,1,.36,1);
  --t-ui:180ms;
  --t-card:220ms;
  --t-art:360ms;
  --t-reveal:320ms;
  --t-theme:260ms;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121413;
    --page-bg:radial-gradient(1100px 640px at 0 0,rgba(168,208,118,.12),rgba(168,208,118,0) 70%),linear-gradient(180deg,#1A1D1A 0,#121413 560px);
    --surface:#1A1D1B;
    --surface-2:#222623;
    --control-active:#2E332F;
    --border:rgba(222,236,212,.08);
    --border-strong:rgba(222,236,212,.17);
    --text:#ECEFE9;
    --text-2:#9CA398;
    --text-3:#686F65;
    --lime-hover:#C4F65E;
    --lime-ink:#B4F03C;
    --lime-ring:rgba(180,240,60,.22);
    --card-bg:#1C1F1D;
    --card-ring:rgba(235,245,225,.06);
    --scrim:rgba(8,10,9,.82);
    --shadow-rest:0 1px 2px rgba(0,0,0,.35);
    --shadow-hover:0 16px 30px -14px rgba(0,0,0,.8);
    --shadow-pop:0 20px 44px -18px rgba(0,0,0,.85),0 0 0 1px rgba(222,236,212,.06);
    --tooltip-bg:#ECEFE9;
    --tooltip-fg:#121413;
    --shadow-rail:14px 0 34px -16px rgba(0,0,0,.75);
    --nav-fg:#A3A7B3;
    --nav-active-bg:rgba(180,240,60,.12);
    --nav-active-fg:#B4F03C;
    --nav-active-ring:none;
    --search-bg:#25282D;
    --search-bg-focus:#2B2F34;
    --card-ring-hover:rgba(235,245,225,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121413;
  --page-bg:radial-gradient(1100px 640px at 0 0,rgba(168,208,118,.12),rgba(168,208,118,0) 70%),linear-gradient(180deg,#1A1D1A 0,#121413 560px);
  --surface:#1A1D1B;
  --surface-2:#222623;
  --control-active:#2E332F;
  --border:rgba(222,236,212,.08);
  --border-strong:rgba(222,236,212,.17);
  --text:#ECEFE9;
  --text-2:#9CA398;
  --text-3:#686F65;
  --lime-hover:#C4F65E;
  --lime-ink:#B4F03C;
  --lime-ring:rgba(180,240,60,.22);
  --card-bg:#1C1F1D;
  --card-ring:rgba(235,245,225,.06);
  --scrim:rgba(8,10,9,.82);
  --shadow-rest:0 1px 2px rgba(0,0,0,.35);
  --shadow-hover:0 16px 30px -14px rgba(0,0,0,.8);
  --shadow-pop:0 20px 44px -18px rgba(0,0,0,.85),0 0 0 1px rgba(222,236,212,.06);
  --tooltip-bg:#ECEFE9;
  --tooltip-fg:#121413;
  --shadow-rail:14px 0 34px -16px rgba(0,0,0,.75);
  --nav-fg:#A3A7B3;
  --nav-active-bg:rgba(180,240,60,.12);
  --nav-active-fg:#B4F03C;
  --nav-active-ring:none;
  --search-bg:#25282D;
  --search-bg-focus:#2B2F34;
  --card-ring-hover:rgba(235,245,225,.14);
  color-scheme:dark;
}

/* ============ base ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--head-h) + var(--s4))}
body{margin:0;background-color:var(--bg);background-image:var(--page-bg);background-attachment:fixed;color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3,p{margin:0}
.i{width:20px;height:20px;flex:none;display:block}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:none}
.brand:focus-visible,.see-all:focus-visible{background:var(--surface-2)}

/* ============ shell ============ */
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;padding-left:var(--rail-w);min-height:100vh}

/* Topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:var(--s6);height:var(--head-h);margin-left:calc(var(--rail-w) * -1);padding:0 var(--gutter) 0 calc((var(--rail-w) - 36px) / 2);background-color:var(--bg);background-image:var(--page-bg);background-attachment:fixed;transition:box-shadow var(--t-ui) var(--ease-out)}
.topbar.is-stuck{box-shadow:0 1px 0 var(--border)}
.brand{display:flex;align-items:center;gap:10px;flex:none;border-radius:var(--r-sm);white-space:nowrap}
.brand .i{width:36px;height:36px}
.brand-word{font-size:23px;font-weight:800;letter-spacing:-.035em;line-height:1}
.top-actions{display:flex;align-items:center;gap:var(--s3);margin-left:auto;flex:none}

/* SearchBar */
.search{position:relative;flex:0 1 480px;min-width:0;margin-left:16px}
.search-field{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 16px;border-radius:999px;background:var(--search-bg);border:1px solid var(--border);box-shadow:var(--shadow-rest);cursor:text;transition:border-color var(--t-ui) var(--ease-out),box-shadow var(--t-ui) var(--ease-out),background-color var(--t-ui) var(--ease-out)}
.search-field:hover{border-color:var(--border-strong)}
.search-field:focus-within{border-color:var(--border-strong);background:var(--search-bg-focus);box-shadow:0 0 0 3px var(--lime-ring)}
.search-field .i{transition:color var(--t-ui) var(--ease-out)}
.search-field:focus-within .i{color:var(--text-2)}
.search-field .i{width:18px;height:18px;color:var(--text-3)}
.search-field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--text)}
.search-field input::placeholder{color:var(--text-3)}
.search-field input::-webkit-search-cancel-button{display:none}
.results{position:absolute;top:calc(100% + var(--s2));left:0;right:0;z-index:40;padding:6px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-pop)}
.results-label{padding:6px 8px 4px;font-size:12px;font-weight:600;color:var(--text-3)}
.res{display:flex;align-items:center;gap:var(--s3);padding:6px;border-radius:var(--r-sm)}
.res.is-active,.res:hover{background:var(--surface-2)}
.res-thumb{position:relative;width:64px;height:36px;border-radius:6px;overflow:hidden;flex:none;background:var(--card-bg)}
.res-thumb svg{position:absolute;inset:0;width:100%;height:100%}
.res b{display:block;font-size:14px;font-weight:600}
.res small{display:block;font-size:12px;color:var(--text-2)}
.res-empty{padding:12px 8px;color:var(--text-2)}

/* ThemeToggle */
.theme{display:flex;gap:2px;height:40px;padding:3px;border-radius:var(--r-ctl);background:var(--surface-2);border:1px solid var(--border)}
.theme button{display:grid;place-items:center;width:32px;border-radius:7px;color:var(--text-3);transition:color var(--t-ui) var(--ease-out),background-color var(--t-ui) var(--ease-out),box-shadow var(--t-ui) var(--ease-out)}
.theme button .i{width:16px;height:16px}
.theme button:hover{color:var(--text)}
.theme button[aria-pressed="true"]{background:var(--control-active);color:var(--text);box-shadow:var(--shadow-rest)}
.theme button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--lime-ring)}


/* Sidebar — icon rail that opens with labels on hover */
.rail{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + var(--head-h));bottom:0;z-index:40;display:flex;flex-direction:column;width:var(--rail-w);background:transparent;transition:width 220ms var(--ease-out),box-shadow 220ms var(--ease-out)}
.rail:hover,.rail:focus-within{width:var(--rail-open);background-color:var(--bg);background-image:var(--page-bg);background-attachment:fixed;box-shadow:var(--shadow-rail);transition-delay:90ms}
.rail-list{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;padding:8px calc((var(--rail-w) - 44px) / 2) 20px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
.rail-list::-webkit-scrollbar{display:none}
.nav{display:flex;align-items:center;gap:10px;flex:none;height:40px;padding:0 9px;border-radius:var(--r-card);color:var(--nav-fg);white-space:nowrap;overflow:hidden;transition:background-color var(--t-ui) var(--ease-out),color var(--t-ui) var(--ease-out),box-shadow var(--t-ui) var(--ease-out)}
.nav .i{width:26px;height:26px}
.nav.is-cat{height:36px}
.nav.is-cat .i{width:24px;height:24px;margin-inline:1px}
.nav-label{font-size:14px;font-weight:600;opacity:0;transition:opacity 160ms var(--ease-out)}
.rail:hover .nav-label,.rail:focus-within .nav-label{opacity:1;transition-delay:130ms}
.nav:hover,.nav:focus-visible{background:var(--surface-2);color:var(--text)}
.nav[aria-current="true"]{background:var(--nav-active-bg);color:var(--nav-active-fg);box-shadow:var(--nav-active-ring)}
.rail-h{position:relative;display:flex;align-items:center;flex:none;height:13px;margin:6px 11px;padding:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);white-space:nowrap}
.rail-h::before{content:"";position:absolute;inset:50% 0 auto;height:1px;background:var(--border-strong);transition:opacity var(--t-ui) var(--ease-out)}
.rail:hover .rail-h::before,.rail:focus-within .rail-h::before{opacity:0}
.rail-h span{opacity:0;transition:opacity 140ms}
.rail:hover .rail-h span,.rail:focus-within .rail-h span{opacity:1;transition-delay:130ms}

/* Main */
.main{min-width:0;padding:var(--s1) var(--gutter) 0 var(--content-gap)}
.main-in{max-width:2000px}

/* ============ Badge ============ */
.badge{position:absolute;top:10px;left:10px;z-index:2;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 7px;border-radius:var(--r-badge);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.badge .i{width:13px;height:13px}
.badge--hot{background:var(--hot);color:#fff}
.badge--new{background:var(--lime);color:var(--on-lime)}
.badge--top{background:var(--top);color:#fff}

/* ============ GameCard ============ */
.card{position:relative;display:block;overflow:hidden;isolation:isolate;border-radius:var(--r-card);background:var(--card-bg);box-shadow:var(--shadow-rest);container-type:inline-size;transition:transform var(--t-card) var(--ease-out),box-shadow var(--t-card) var(--ease-out)}
.card:active{transform:translateY(-1px);transition-duration:120ms}
.card::after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--card-ring);pointer-events:none;transition:box-shadow var(--t-card) var(--ease-out)}
.card:hover::after,.card:focus-visible::after{box-shadow:inset 0 0 0 1px var(--card-ring-hover)}
.card .cover{position:absolute;inset:0;width:100%;height:100%;display:block;transition:transform var(--t-art) var(--ease-out)}
.cover text{font-family:"Lilita One","Arial Black",Impact,sans-serif}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.card:hover .cover,.card:focus-visible .cover{transform:scale(1.02)}
.card:active .cover{transform:scale(1.015)}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s2);padding:36px 12px 12px;background:linear-gradient(to top,var(--scrim),rgba(6,14,24,0))}
/* open caption (New & popular): deeper scrim, square game icon next to the title, likes under it */
.cap::before{content:"";position:absolute;inset:-40px 0 0;z-index:-1;background:linear-gradient(to top,rgba(6,14,24,.6),rgba(6,14,24,0));opacity:0;transition:opacity var(--t-card) var(--ease-out)}
.cap-body{--icon:clamp(34px,15cqw,52px);flex:1;min-width:0;display:grid;grid-template-columns:0px minmax(0,1fr);column-gap:0;align-items:end;transition:grid-template-columns var(--t-card) var(--ease-out),column-gap var(--t-card) var(--ease-out)}
.cap-icon{position:relative;width:var(--icon);height:var(--icon);border-radius:var(--r-card);overflow:hidden;opacity:0;background:rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(255,255,255,.22),0 4px 10px rgba(0,0,0,.3);transition:opacity var(--t-card) var(--ease-out)}
.cap-icon svg{position:absolute;inset:0;width:100%;height:100%}
.cap-text{display:grid;grid-template-rows:auto 0fr;min-width:0;transition:grid-template-rows var(--t-card) var(--ease-out)}
.cap-title{font-size:clamp(13px,4.6cqw,17px);font-weight:700;letter-spacing:-.01em;line-height:1.2;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-feat .cap-title{font-size:clamp(16px,5.4cqw,24px);font-weight:800}
.meta{display:flex;align-items:center;gap:10px;min-height:0;overflow:hidden;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.9);white-space:nowrap;font-variant-numeric:tabular-nums;opacity:0;transform:translateY(4px);transition:opacity var(--t-card) var(--ease-out),transform var(--t-card) var(--ease-out)}
.meta .m{display:inline-flex;align-items:center;gap:5px;margin-top:4px}
.meta .i{width:14px;height:14px}
.card.is-open .cap::before{opacity:1}
.card.is-open .cap-body{grid-template-columns:var(--icon) minmax(0,1fr);column-gap:10px}
.card.is-open .cap-icon{opacity:1}
.card.is-open .cap-text{grid-template-rows:auto 1fr}
.card.is-open .cap-title{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card.is-open .meta{opacity:1;transform:none}
@container (max-width:150px){.cap-icon{display:none}.card.is-open .cap-body{grid-template-columns:0px minmax(0,1fr);column-gap:0}}
.is-feat .cap{padding:80px 20px 18px}
.play{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:#fff;color:#0F1E2E;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:background-color var(--t-ui) var(--ease-out)}
.play .i{width:15px;height:15px;margin-left:2px}
.card:hover .play{background:var(--lime)}

/* ============ Mosaic — the reference composition, full width ============ */
/* Card proportions are the reference's 1:1: featured + 2+1 block, a row of 5, a row of 6. */
.mosaic{
  container-type:inline-size;display:flex;flex-direction:column;gap:var(--gap);
  /* rows keep the reference ratio 199:165:154:139 but the whole grid fits one screen under the header */
  --fit:max(.7px, calc((100svh - var(--head-h) - 83px - 3 * var(--gap)) / 657));
}
.mosaic>.sec-title{margin-bottom:var(--s4)}
.m-a,.m-r3,.m-r6{display:grid;gap:var(--gap)}
.m-a{
  --u:calc((100cqw - 3 * var(--gap)) / 743);
  grid-template-columns:288fr 110fr 105fr 240fr;
  grid-template-rows:calc(min(var(--u), var(--fit)) * 199) calc(min(var(--u), var(--fit)) * 165);
  grid-template-areas:"f t t w" "f b m p";
}
.m-r3{grid-template-columns:151fr 140fr 186fr 126fr 134fr;grid-auto-rows:min(calc((100cqw - 4 * var(--gap)) / 737 * 154), calc(var(--fit) * 154))}
.m-r6{grid-template-columns:118fr 119fr 118fr 121fr 125fr 128fr;grid-auto-rows:min(calc((100cqw - 5 * var(--gap)) / 729 * 139), calc(var(--fit) * 139))}

/* ============ Rows ============ */
/* every row below the mosaic scrolls sideways (trackpad, shift+wheel, mouse drag, swipe):
   the next card peeks in at the right edge */
.row-4,.row-6,.cats{
  --peek:.4;display:grid;grid-auto-flow:column;grid-template-columns:none;
  grid-auto-columns:calc((100% - var(--n) * var(--gap)) / (var(--n) + var(--peek)));gap:var(--gap);
  overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin:-6px 0 -10px;padding:6px 0 10px;
}
.row-4::-webkit-scrollbar,.row-6::-webkit-scrollbar,.cats::-webkit-scrollbar{display:none}
.row-4>*,.row-6>*,.cats>*{scroll-snap-align:start}
.row-4{--n:4}
.row-4 .card{aspect-ratio:188/126}
.row-6{--n:5}
.row-6 .card{aspect-ratio:3/5}
.is-dragging{scroll-snap-type:none;cursor:grabbing;user-select:none}
.is-dragging>*{pointer-events:none}

/* ============ CategoryButton ============ */
.cats{--n:8}
.cat{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-rest);color:var(--text);transition:border-color var(--t-ui) var(--ease-out),box-shadow var(--t-ui) var(--ease-out)}
.cat-badge{display:grid;place-items:center;width:22px;height:22px;flex:none}
.cat-badge .i{width:22px;height:22px;color:var(--nav-fg)}
.cat-text{min-width:0;display:flex;flex-direction:column;gap:1px}
.cat-count{font-size:12px;font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.cat-name{font-size:14px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .chev{position:absolute;top:12px;right:12px;width:14px;height:14px;color:var(--text-3);transition:color var(--t-ui) var(--ease-out)}
.cat-name{font-size:14px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat:hover,.cat:focus-visible{border-color:var(--border-strong);box-shadow:var(--shadow-hover)}
.cat:hover .chev,.cat:focus-visible .chev{color:var(--text)}

/* ============ Section ============ */
.sec{margin-top:36px}
.sec-cats{margin-top:32px}
.sec-title{margin-bottom:var(--s4);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.sec-head{display:flex;align-items:center;margin-bottom:var(--s4)}
.sec-head .sec-title{margin-bottom:0}
.see-all{display:inline-flex;align-items:center;gap:6px;line-height:1;color:var(--text);transition:color var(--t-ui) var(--ease-out)}
.see-all .sec-title{color:inherit}
.see-all .i{position:relative;top:3px;width:30px;height:30px;flex:none;display:block;color:var(--text);transition:color var(--t-ui) var(--ease-out),transform var(--t-ui) var(--ease-out)}
.see-all:hover,.see-all:focus-visible{color:var(--lime-ink)}
.see-all:hover .i,.see-all:focus-visible .i{color:var(--lime-ink);transform:translateX(2px)}

/* ============ Footer ============ */

/* ================= logo lettering ================= */
function logo(c,text,pos,o={}){
  const{W,H,S}=c,lines=text.split('|'),small=S<=110;
  let fs=S*(lines.length>1?.155:.18)*(small?1.16:1);
  const pad=S*.075,maxLen=Math.max(...lines.map(l=>l.length));
  fs=Math.min(fs,(W-pad*2)/(maxLen*.54));
  const lh=fs*.9,h=pos[1],anchor=h==='l'?'start':h==='r'?'end':'middle',x=h==='l'?pad:h==='r'?W-pad:W/2;
  const y0=pos[0]==='t'?pad+fs*.8:H-pad-(lines.length-1)*lh-fs*.02,stroke=o.stroke||'#1A2150';
  const gold=c.lin(o.fill||['#FFF36B','#FFC21A','#FF9E0B']);
  return lines.map((ln,i)=>{const y=y0+i*lh,fill=o.two&&i===0?'#FFFFFF':gold;
    return t`<text x="${x}" y="${y+fs*.08}" font-size="${fs}" text-anchor="${anchor}" fill="${stroke}" stroke="${stroke}" stroke-width="${fs*.16}" stroke-linejoin="round" opacity=".55">${esc(ln)}</text><text x="${x}" y="${y}" font-size="${fs}" text-anchor="${anchor}" fill="${fill}" stroke="${stroke}" stroke-width="${fs*.15}" stroke-linejoin="round" paint-order="stroke">${esc(ln)}</text>`;}).join('');
}

function cover(g,W,H,withLogo){
  const c=ctx(W,H,hash(g.id)),on=withLogo&&g.logo;
  if(on){const lines=g.logo.split('|').length,pos=g.lp||'bc';
    if(W/H>=1.6&&pos[1]!=='c'){c.cx=pos[1]==='r'?W*.36:W*.64;c.U=c.S*.95;}
    else if(H/W>=1.6){c.U=c.S*1.1;c.cy=H/2+(pos[0]==='t'?1:-1)*c.S*.22;}
    else{c.U=c.S*(lines>1?.8:.86);c.cy=H/2+(pos[0]==='t'?1:-1)*c.S*(lines>1?.13:.09);}}
  let body=SC[g.s](c,g.o||{});
  if(on)body+=logo(c,g.logo,g.lp||'bc',g.lo||{});
  return`<svg class="cover" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><defs>${c.defs.join('')}</defs>${body}</svg>`;
}

// likes for the open caption, stable per game
const compact = n => {
  const f = (v, u) => (v < 10 ? v.toFixed(1).replace('.0', '') : Math.round(v)) + u;
  return n >= 1e6 ? f(n / 1e6, 'M') : n >= 1e3 ? f(n / 1e3, 'K') : String(Math.round(n));
};
function Meta(id) {
  const r = rng(hash(id + '#stats')), plays = Math.round(Math.exp(Math.log(6e4) + r() * (Math.log(3e7) - Math.log(6e4)))), likes = plays * (.002 + r() * .004);

}
function GameCard(id, { ar, area = '', badge = '', play = false, feat = false, open = false }) {

}

  Multiplayer: ['robo-arena', 'sky-arena', 'stick-duel', 'blob-party'],
  Kids: ['snow-buddy', 'reef-friends', 'paw-pals', 'chick-hop', 'teddy-town', 'jelly-bears'],
  Casual: ['bubble-buddies', 'hide-and-peek', 'cat-cafe', 'burger-bash'],
  Merge: ['berry-merge', 'fruit-frenzy', 'merge-kitties', 'ocean-merge', 'gem-merge', 'cube-merge'],
  Shooting: ['rocket-rescue', 'galaxy-raid', 'target-pro', 'mech-blast'],
  Word: ['quiz-blocks', 'word-wood', 'spell-it', 'letter-drop', 'fun-words', 'word-hunt'],
  Cards: ['solitaire', 'spider-cards', 'mahjong-classic', 'poker-pals'],
  Music: ['beat-buddy', 'dj-bot', 'rhythm-orbs', 'disco-blob', 'piano-blocks', 'melody-pop'],
};
// each row gets 10 games so there is something to scroll to: its own list, then the genre, then the rest
const ALL_IDS = Object.keys(G);
$('cat-sections').innerHTML = [...CATS, ...MORE_CATS].map(({ name }, ci) => {
  const ids = [...CAT_GAMES[name]];
  const add = id => { if (ids.length < 10 && !ids.includes(id)) ids.push(id); };
  ALL_IDS.filter(id => G[id].g === name).forEach(add);
  ALL_IDS.forEach((_, i) => add(ALL_IDS[(i + ci * 5) % ALL_IDS.length]));
  const cards = ids.map(id => GameCard(id, { ar: RA, play: true })).join('');
  return `<section class="sec" id="${catId(name)}" aria-labelledby="h-${catId(name)}">
    <div class="sec-head"><a class="see-all" href="#" aria-label="See all ${name} games"><h2 class="sec-title" id="h-${catId(name)}">${name}</h2>${icon('caret-right')}</a></div>
    <div class="row-4">${cards}</div></section>`;
}).join('');
document.querySelectorAll('[data-i]').forEach(el => { el.outerHTML = icon(el.dataset.i); });

// game links are placeholders in this prototype
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a && !document.getElementById(a.hash.slice(1))) e.preventDefault();
});

/* ---------- theme ---------- */
const root = document.documentElement;
const mq = matchMedia('(prefers-color-scheme: dark)');
const effTheme = () => (root.dataset.theme === 'dark' || root.dataset.theme === 'light') ? root.dataset.theme : (mq.matches ? 'dark' : 'light');
const syncTheme = () => document.querySelectorAll('[data-set-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.setTheme === effTheme())));
try { const s = localStorage.getItem('zabava-theme'); if (s === 'dark' || s === 'light') root.dataset.theme = s; } catch (e) {}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
// Theme change cross-fades the whole page in one pass (backgrounds, surfaces, text, nav states).
// The artwork is identical in both themes, so it does not visibly fade.
function applyTheme(t) {
  const set = () => {
    root.dataset.theme = t;
    try { localStorage.setItem('zabava-theme', t); } catch (e) {}
    syncTheme();
  };
  if (reduceMotion.matches || effTheme() === t) return set();
  if (document.startViewTransition) return document.startViewTransition(set);
  root.classList.add('theme-fading');
  set();
  setTimeout(() => root.classList.remove('theme-fading'), 320);
}
document.querySelectorAll('[data-set-theme]').forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.setTheme)));
mq.addEventListener('change', syncTheme);
new MutationObserver(syncTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
syncTheme();

/* ---------- scrolling rows ---------- */
document.querySelectorAll('.row-4,.row-6,.cats').forEach(row => {
  // a mouse can drag the row; a drag never counts as a click on the card under it
  let startX = 0, startLeft = 0, moved = false;
  row.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    startX = e.clientX; startLeft = row.scrollLeft; moved = false;
    const move = ev => {
      const dx = ev.clientX - startX;
      if (!moved && Math.abs(dx) > 5) { moved = true; row.classList.add('is-dragging'); }
      if (moved) row.scrollLeft = startLeft - dx;
    };
    const up = () => {
      removeEventListener('pointermove', move);
      removeEventListener('pointerup', up);
      if (!moved) return;
      // release onto the nearest card edge
      const step = row.children[1].offsetLeft - row.children[0].offsetLeft, left = row.scrollLeft;
      row.classList.remove('is-dragging');
      row.scrollLeft = left;
      row.scrollTo({ left: Math.round(left / step) * step, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
      const eat = ev => { ev.preventDefault(); ev.stopPropagation(); };
      row.addEventListener('click', eat, { capture: true, once: true });
      setTimeout(() => row.removeEventListener('click', eat, { capture: true }), 0);
    };
    addEventListener('pointermove', move);
    addEventListener('pointerup', up);
  });
});

/* ---------- section reveals ---------- */
if (!reduceMotion.matches && 'IntersectionObserver' in window) {
  const reveal = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    const sec = en.target;
    sec.classList.add('is-in');
    reveal.unobserve(sec);
    // once revealed, hand the cards back to their normal hover transitions
    setTimeout(() => sec.classList.remove('will-reveal', 'is-in'), 700);
  }), { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.sec').forEach(sec => {
    if (sec.getBoundingClientRect().top < innerHeight) return; // already on screen: show as is
    sec.querySelectorAll('.row-4>*,.row-6>*').forEach((c, i) => c.style.setProperty('--i', Math.min(i, 5)));
    sec.classList.add('will-reveal');
    reveal.observe(sec);
  });
}

/* ---------- topbar edge ---------- */
const topbar = $('topbar');
const onScroll = () => topbar.classList.toggle('is-stuck', scrollY > 4);
addEventListener('scroll', onScroll, { passive: true }); onScroll();

/* ---------- sidebar scroll-spy ---------- */
const spyLinks = [...document.querySelectorAll('[data-spy]')];
const spy = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    spyLinks.forEach(l => (l.dataset.spy === en.target.id ? l.setAttribute('aria-current', 'true') : l.removeAttribute('aria-current')));
  });
}, { rootMargin: '-45% 0px -50% 0px' });
spyLinks.forEach(l => { const s = $(l.dataset.spy); if (s) spy.observe(s); });

/* ---------- search ---------- */
const q = $('q');
const box = $('results');
let hits = [], active = -1;
function renderResults() {
  const v = q.value.trim().toLowerCase();
  if (!v) { box.hidden = true; q.setAttribute('aria-expanded', 'false'); return; }
  hits = Object.keys(G).filter(s => G[s].t.toLowerCase().includes(v) || G[s].g.toLowerCase().includes(v)).slice(0, 6);
  active = hits.length ? 0 : -1;
  box.innerHTML = hits.length
    ? `<div class="results-label">Games</div>` + hits.map((s, i) =>
        `<a class="res${i === active ? ' is-active' : ''}" role="option" href="#${s}" data-n="${i}"><span class="res-thumb">${art(s, 16 / 9)}</span><span><b>${G[s].t}</b><small>${G[s].g}</small></span></a>`).join('')
    : `<div class="res-empty">No games match “${q.value.trim().replace(/[<>&]/g, '')}”. Try a genre like Puzzle or Racing.</div>`;
  box.hidden = false; q.setAttribute('aria-expanded', 'true');
}
function move(d) {
  if (!hits.length) return;
  active = (active + d + hits.length) % hits.length;
  box.querySelectorAll('.res').forEach((el, i) => el.classList.toggle('is-active', i === active));
}
q.addEventListener('input', renderResults);
q.addEventListener('focus', renderResults);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (e.key === 'Enter' && active > -1) { e.preventDefault(); q.value = G[hits[active]].t; box.hidden = true; }
  else if (e.key === 'Escape') { box.hidden = true; q.blur(); }
});
box.addEventListener('mousedown', e => {
  const r = e.target.closest('.res'); if (!r) return;
  e.preventDefault(); q.value = G[hits[Number(r.dataset.n)]].t; box.hidden = true;
});
q.addEventListener('blur', () => setTimeout(() => { box.hidden = true; q.setAttribute('aria-expanded', 'false'); }, 120));
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
});
</script>
